name: Collect shirts
on:
  schedule:
    - cron: "17 10 * * *"   # every day, 5:17 AM Eastern
  workflow_dispatch:        # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py shirts.json
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shirts.json
          git diff --cached --quiet || git commit -m "Update shirts"
          git push
